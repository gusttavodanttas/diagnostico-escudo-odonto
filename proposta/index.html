<style>
/* Layout: proposta em coluna única, mesmos tokens do site · cabeçalho com tema e PDF · termômetro + pontos explicados · cartões de opções com a sugerida destacada */
:root{
  --bg:#0F0E0D; --surface:#181614; --raise:#211E1B; --line:#2E2925;
  --fg:#EEE8E1; --muted:#A69C91; --accent:#E87C1E; --copper:#C08350; --on-accent:#140C05;
  --ok:#4CB87E; --warn:#F08A24; --crit:#EF5A52;
  --crit-s:rgba(239,90,82,.30); --warn-s:rgba(240,138,36,.30); --ok-s:rgba(76,184,126,.30); --crit-b:rgba(239,90,82,.5); --warn-b:rgba(240,138,36,.5);
  --display:"Cinzel",Georgia,"Times New Roman",serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F4F3F1; --surface:#FFFFFF; --raise:#ECEAE7; --line:#DCD7D1;
  --fg:#16130F; --muted:#56504A; --accent:#C45F0B; --copper:#9A5626; --on-accent:#FFFFFF;
  --ok:#1E8A4F; --warn:#C45F0B; --crit:#C9342B; --crit-s:rgba(201,52,43,.22); --warn-s:rgba(196,95,11,.22); --ok-s:rgba(30,138,79,.22); --crit-b:rgba(201,52,43,.5); --warn-b:rgba(196,95,11,.5); color-scheme:light }}
:root[data-theme="light"]{
  --bg:#F4F3F1; --surface:#FFFFFF; --raise:#ECEAE7; --line:#DCD7D1;
  --fg:#16130F; --muted:#56504A; --accent:#C45F0B; --copper:#9A5626; --on-accent:#FFFFFF;
  --ok:#1E8A4F; --warn:#C45F0B; --crit:#C9342B; --crit-s:rgba(201,52,43,.22); --warn-s:rgba(196,95,11,.22); --ok-s:rgba(30,138,79,.22); --crit-b:rgba(201,52,43,.5); --warn-b:rgba(196,95,11,.5); color-scheme:light }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15.5px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0;letter-spacing:.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top::before{content:"";display:block;height:3px;background:linear-gradient(90deg,var(--accent),var(--copper))}
.top-in{max-width:820px;margin:0 auto;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.06em;display:flex;align-items:center;gap:10px}
.logo svg{width:20px;height:24px;flex:none}
.acts{display:flex;align-items:center;gap:8px}
.btn{border:1px solid var(--line);background:var(--raise);padding:9px 14px;border-radius:9px;font-size:14px;font-weight:600;text-decoration:none;color:var(--fg);display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--copper)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.theme-btn{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--raise);color:var(--fg);display:inline-flex;align-items:center;justify-content:center;padding:0}
.theme-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.theme-btn .i-moon{display:none}
:root[data-theme="dark"] .theme-btn .i-sun{display:none}:root[data-theme="dark"] .theme-btn .i-moon{display:block}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .theme-btn .i-sun{display:none}:root:not([data-theme="light"]) .theme-btn .i-moon{display:block}}

#doc{max-width:820px;margin:0 auto;padding-block:32px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px;background:var(--bg)}
.eyebrow{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--copper);font-weight:600;margin-bottom:6px}
.hero h1{font-size:clamp(28px,6vw,40px);line-height:1.12}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero .meta{color:var(--muted);margin-top:10px;font-size:14.5px}
.lead{color:var(--muted);max-width:62ch;margin-top:10px}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px 22px}
section.card h2{font-size:22px;margin-bottom:6px}

.t-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:14px 0 12px}
.t-num{font-family:var(--display);font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.t-num small{font-size:24px}
.t-lvl{font-weight:600;font-size:18px}
.lv-crit{color:var(--crit)}.lv-warn{color:var(--warn)}.lv-ok{color:var(--ok)}
.t-track{position:relative;height:18px;border-radius:99px;background:linear-gradient(90deg,var(--crit-s) 0 50%,var(--warn-s) 50% 80%,var(--ok-s) 80% 100%),var(--raise);border:1px solid var(--line);overflow:hidden}
.t-fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:99px;background:linear-gradient(90deg,var(--crit) 0 50%,var(--warn) 50% 80%,var(--ok) 80% 100%);background-repeat:no-repeat;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.t-scale{display:grid;grid-template-columns:50fr 30fr 20fr;font-size:12px;margin-top:6px}
.t-scale span:nth-child(1){color:var(--crit)}.t-scale span:nth-child(2){color:var(--warn)}.t-scale span:nth-child(3){color:var(--ok)}
.t-scale span+span{border-left:1px solid var(--line);padding-left:6px}

.alerts{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;gap:14px}
.alerts li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding-top:14px;border-top:1px solid var(--line);break-inside:avoid}
.alerts li:first-child{border-top:0;padding-top:0}
.pr{grid-row:span 2;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;border:1px solid;align-self:start;margin-top:2px;white-space:nowrap}
.pr.p1{color:var(--crit);border-color:var(--crit-b)}
.pr.p2{color:var(--warn);border-color:var(--warn-b)}
.pr.p3{color:var(--muted);border-color:var(--line)}
.alerts b{font-weight:600}
.alerts span.why{color:var(--muted);font-size:14.5px}
.more{color:var(--muted);font-size:14px;margin-top:14px}
.note{font-size:13.5px;color:var(--muted);border-left:2px solid var(--copper);padding:2px 0 2px 12px;margin-top:16px;max-width:64ch}

.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.opt{position:relative;border:1px solid var(--line);border-radius:14px;padding:18px 16px 16px;background:var(--bg);display:flex;flex-direction:column;gap:10px;break-inside:avoid}
.opt.sel{border:2px solid var(--accent);padding:17px 15px 15px}
.badge{position:absolute;top:-11px;left:14px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:600;letter-spacing:.04em;padding:3px 9px;border-radius:99px}
.opt h3{font-family:var(--body);font-size:16.5px;font-weight:600}
.opt .for{font-size:13.5px;color:var(--muted)}
.opt ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px;flex:1}
.opt li{display:flex;gap:8px}
.opt li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--copper);margin-top:8px}
.opt li.no{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.opt li.no::before{background:var(--line)}
.price{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:2px}
.price b{font-family:var(--display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.price span{font-size:12.5px;color:var(--muted)}

.cond{margin:12px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:14.5px}
.cond b{font-weight:600}
.steps{margin:12px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.cta{margin-top:18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ident{font-size:13px;color:var(--muted);line-height:1.7;text-align:center;border-top:1px solid var(--line);padding-top:18px}
.ident b{color:var(--fg);font-weight:600}
.state{max-width:560px;margin:80px auto;padding:0 16px;text-align:center;color:var(--muted)}
.state h1{color:var(--fg);font-size:24px;margin-bottom:10px}
@page{size:A4;margin:12mm}
@media print{
  html,body{background:var(--bg)!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body::before,.no-pdf{display:none!important}
  #doc{max-width:none;padding:0;gap:14px}
  section.card{break-inside:auto;padding:18px 18px}
  .opt,.alerts li,.hero,.t-head,.t-track{break-inside:avoid}
  section.card h2,.eyebrow{break-after:avoid}
  body{font-size:13.5px}
  .t-fill{transition:none!important}
  .opts{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:10px!important}
  a{text-decoration:none}
}
@media (max-width:720px){.opts{grid-template-columns:minmax(0,1fr);gap:18px}.top .btn .lbl{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

];

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const level=p=>p>=80?['ok','Clínica protegida']:p>=50?['warn','Atenção moderada']:['crit','Clínica exposta'];
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
function cards(list,sel){
  return `<div class="opts">${list.map(o=>{const s=norm(sel)&&norm(sel).includes(norm(o.k));return `<div class="opt${s?' sel':''}">${s?'<span class="badge">Sugerida para a sua clínica</span>':''}<h3>${esc(o.k)}</h3><p class="for">${esc(o.for)}</p><ul>${o.items.map(([t,y])=>`<li class="${y?'':'no'}">${esc(t)}</li>`).join('')}</ul><div class="price"><b>${esc(o.price)}</b><span>${esc(o.sub)}</span></div></div>`}).join('')}</div>`;
}
function render(d){
  const pct=d.pct===''||d.pct==null?null:Math.round(Number(d.pct));
  const lv=pct==null?null:level(pct);
  const al=(d.alertas||[]).map(t=>{const w=WHY[t]||[3,''];return {t,p:w[0],why:w[1]}}).sort((a,b)=>a.p-b.p);
  const shown=al.slice(0,8),rest=al.length-shown.length;
  const nome=d.nome?`Dr(a). ${esc(d.nome)}`:'';
  document.title=`Proposta · ${d.clinica||'Escudo Odonto'}`;
  document.getElementById('doc').innerHTML=`
  <div class="hero">
    <div class="eyebrow">Proposta de assessoria jurídica preventiva</div>
    <h1>Proposta para <em>${esc(d.clinica||'sua clínica')}</em></h1>
    <p class="meta">${nome?`Aos cuidados de ${nome} · `:''}Brasília, ${esc(d.dataExtenso||d.data||'')}</p>
    <p class="lead">Preparada a partir do diagnóstico que você respondeu${d.dataDiag?` em ${esc(d.dataDiag)}`:''}. Ela mostra os pontos que pedem atenção na clínica e as formas de tratá-los.</p>
  </div>

  <section class="card">
    <div class="eyebrow">O que o diagnóstico mostrou</div>
    <h2>Termômetro de proteção da clínica</h2>
    ${pct==null?'<p class="lead">Sem respostas suficientes para calcular o termômetro.</p>':`
    <div class="t-head"><span class="t-num lv-${lv[0]}">${pct}<small>%</small></span><span class="t-lvl lv-${lv[0]}">${lv[1]}</span></div>
    <div class="t-track"><div class="t-fill" id="tFill"></div></div>
    <div class="t-scale"><span>Exposta · até 49%</span><span>Atenção · 50 a 79%</span><span>Protegida · 80%+</span></div>`}
    ${al.length?`<h3 style="font-size:17px;margin-top:22px">${al.length} ponto${al.length>1?'s':''} de alerta</h3>
    <ul class="alerts">${shown.map(a=>`<li><span class="pr p${a.p}">${PRL[a.p]}</span><b>${esc(a.t)}</b><span class="why">${esc(a.why)}</span></li>`).join('')}</ul>
    ${rest>0?`<p class="more">E mais ${rest} ponto${rest>1?'s':''} de organização, tratados no plano de ação.</p>`:''}`:'<p class="lead">Nenhum ponto de alerta nas respostas enviadas.</p>'}
    <p class="note">Esta é uma leitura inicial feita a partir das respostas enviadas. Ela é confirmada na análise dos documentos e da rotina da clínica.</p>
  </section>

  ${d.obs?`<section class="card"><div class="eyebrow">Observação</div><p>${esc(d.obs)}</p></section>`:''}

  <section class="card">
    <div class="eyebrow">Para começar</div>
    <h2>Três formas de tratar os pontos</h2>
    <p class="lead">Cada opção inclui o que está na anterior.</p>
    ${cards(OPCOES,d.opcao)}
  </section>

  <section class="card">
    <div class="eyebrow">Depois dos 90 dias</div>
    <h2>Acompanhamento mensal</h2>
    <p class="lead">Mantém documentos, contratos e publicidade em dia conforme a equipe e os procedimentos mudam. Quem contrata a Implantação já sai dela com o plano mensal ativo.</p>
    ${cards(PLANOS,d.plano)}
  </section>

  <section class="card">
    <div class="eyebrow">Condições</div>
    <h2>Como funciona</h2>
    <ul class="cond">
      <li><b>Pagamento:</b> Pix ou boleto. O Plano de Ação e o Diagnóstico Completo são pagos na contratação. A Implantação pode ser paga em 3 parcelas mensais.</li>
      <li><b>Planos mensais:</b> contrato de 12 meses com renovação automática.</li>
      <li><b>Não está incluído:</b> atuação em processo judicial, defesa em processo ético no CRO, defesa em fiscalização da Vigilância Sanitária ou do Procon e audiências. Esses serviços são orçados à parte, se forem necessários.</li>
      <li><b>Prazos:</b> começam a contar quando a clínica envia os documentos pedidos.</li>
      <li><b>Resultado:</b> o trabalho reduz riscos jurídicos, mas não garante que a clínica não será fiscalizada ou acionada.</li>
      <li><b>Validade:</b> esta proposta vale até ${esc(d.validade||'10 dias após a data acima')}.</li>
    </ul>
  </section>

  <section class="card">
    <div class="eyebrow">Próximos passos</div>
    <h2>Para seguir</h2>
    <ol class="steps">
      <li>Responda no WhatsApp com a opção escolhida.</li>
      <li>Enviamos o contrato de prestação de serviços para assinatura eletrônica.</li>
      <li>Após o pagamento, você recebe a lista de documentos da clínica e o trabalho começa.</li>
    </ol>
    <div class="cta no-pdf"><a class="btn pri" target="_blank" rel="noopener" href="https://wa.me/${WHATS}?text=${encodeURIComponent('Olá! Li a proposta da '+(d.clinica||'clínica')+' e quero conversar.')}">Responder no WhatsApp</a></div>
  </section>

  <p class="ident"><b>Escudo Odonto</b><br>Gustavo Dantas Sociedade Individual de Advocacia · CNPJ 39.832.719/0001-24<br>Gustavo Dantas Ferreira · OAB/DF 61.199<br>(61) 99845-7701 · ceo@gustavodantas.adv.br · www.escudoodonto.com.br</p>`;
  const f=document.getElementById('tFill');
  if(f){f.style.backgroundSize=pct>0?(10000/pct)+'% 100%':'100% 100%';requestAnimationFrame(()=>requestAnimationFrame(()=>{f.style.width=pct+'%'}))}
  document.getElementById('pdfBtn').hidden=false;
  window.__prop=d;
}
function fail(msg){document.getElementById('doc').innerHTML=`<div class="state"><h1>Proposta não encontrada</h1><p>${esc(msg)}</p></div>`}

(async function(){
  const p=new URLSearchParams(location.search).get('p')||'';
  if(window.__PROPOSTA_DEMO){render(window.__PROPOSTA_DEMO);return}
  if(!/^[A-Za-z0-9_-]{12,64}$/.test(p)){fail('O link está incompleto. Confira se ele foi copiado inteiro.');return}
  try{
    const r=await fetch(SHEET_URL+'?p='+encodeURIComponent(p),{cache:'no-store'});
    const d=await r.json();
    if(!d||!d.ok){fail('Este link não corresponde a nenhuma proposta ativa.');return}
    render(d);
  }catch(e){fail('Não foi possível carregar agora. Tente de novo em alguns instantes.')}
})();

document.getElementById('pdfBtn').addEventListener('click',()=>{const f=document.getElementById('tFill');if(f){f.style.transition='none'}window.print()});

(function(){var r=document.documentElement,b=document.getElementById('themeBtn');
function cur(){return r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}
function lab(){b.setAttribute('aria-label',cur()==='dark'?'Mudar para o tema claro':'Mudar para o tema escuro')}
lab();b.addEventListener('click',function(){var n=cur()==='dark'?'light':'dark';r.setAttribute('data-theme',n);try{localStorage.setItem('eo-theme',n)}catch(e){}lab()});})();
</script>

</body>
</html>
